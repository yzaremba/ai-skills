# Codex dictionary: what the framework's tiers and effort names mean on Codex,
# and what was checked about the provider on the date below.
#
# [tiers] and [efforts] are the shipped layer of the settings section
# [providers.codex]. They are a proposal: `init` shows the mapping, checks it
# against the installed client's model list, and the user confirms or changes
# it. Do not edit this file to change a mapping; put the key in a settings
# file, for example ~/.agents/workflow.toml:
#   [providers.codex.tiers]
#   deep = "gpt-6-astra"
# The rest of the file is not a setting. It is what setup knows about the
# provider, and `init` and `doctor` compare it with what is installed.
#
# Source: the output of `codex debug models` (the refreshed catalog) on the
# checked version and date. What an account can actually use may differ.
# The catalog shipped in the 0.162.1 binary (`--bundled`) is another list: it
# has no `gpt-reserve`, two hidden models more, and other defaults.
# Read on the same date:
#   https://learn.chatgpt.com/docs/config-file/config-advanced  (profile files)
#   https://learn.chatgpt.com/docs/developer-commands           (`codex debug models`)
#   https://github.com/openai/codex/releases                    (0.160.1 to 0.162.1)

schema_version = 1

checked_on_version = "0.162.1"
checked_on_date = "2026-10-11"
# A starting role is given to Codex as a profile file, <name>.config.toml in
# the Codex home. The configuration page (Profiles) says: "In Codex 0.134.0
# and later, `--profile` no longer reads `[profiles.profile-name]` from
# `config.toml`", and has such settings moved into that file. It does not
# say whether an older client reads the file, so nothing older is supported.
oldest_supported_version = "0.134.0"

[model_list]
# Prints {"models": [...]}; each entry has `slug`, `visibility`,
# `default_reasoning_level` and `supported_reasoning_levels[].effort`.
# It refreshes the catalog over the network and sends no model request.
command = ["codex", "debug", "models"]
# The catalog shipped in the binary, with no refresh.
offline_command = ["codex", "debug", "models", "--bundled"]
# Codex's command reference lists `codex debug models` with the maturity
# `experimental`.
experimental = true
note = "Read with a debug command that Codex marks experimental; it can change without notice."

# Standard and deep share a model by choice and differ by the role's effort.
# The catalog offers a fourth current model, `gpt-6-sol`, which a settings
# file can map to either tier.
[tiers]
fast = "gpt-6-luna"
standard = "gpt-6.1-sol"
deep = "gpt-6.1-sol"
frontier = "gpt-6-astra"

# Framework effort name -> the value written into an agent definition.
# The names are the same on Codex, `max` included: every mapped model lists a
# level called `max`. Two listed levels have no framework name and are reached
# only by an explicit override in a settings file: `xhigh`, between high and
# max, and `ultra`, above max, which `gpt-6-luna` does not accept.
#   [providers.codex.efforts]
#   max = "ultra"
[efforts]
low = "low"
medium = "medium"
high = "high"
max = "max"

# Every entry of the catalog, in the catalog's order. `visibility` and
# `default_effort` (the catalog's `default_reasoning_level`) are as listed.
# An entry with visibility "hide" is not offered for selection.

[models."gpt-6.1-sol"]
efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]
visibility = "list"
default_effort = "low"

[models.gpt-6-astra]
efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]
visibility = "list"
default_effort = "medium"

[models.gpt-6-sol]
efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]
visibility = "list"
default_effort = "medium"

[models.gpt-6-luna]
efforts = ["low", "medium", "high", "xhigh", "max"]
visibility = "list"
default_effort = "medium"

[models.gpt-reserve]
efforts = ["low", "medium", "high", "xhigh", "max"]
visibility = "hide"
default_effort = "medium"

[models."gpt-5.6-sol"]
efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]
visibility = "list"
default_effort = "low"

[models."gpt-5.6-terra"]
efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]
visibility = "list"
default_effort = "medium"

[models."gpt-5.6-luna"]
efforts = ["low", "medium", "high", "xhigh", "max"]
visibility = "list"
default_effort = "medium"

[models."gpt-5.5"]
efforts = ["low", "medium", "high", "xhigh"]
visibility = "hide"
default_effort = "medium"

[models.codex-auto-review]
efforts = ["low", "medium", "high", "xhigh", "max"]
visibility = "hide"
default_effort = "medium"
