# Claude Code dictionary: what the framework's tiers and effort names mean on
# Claude Code, and what was checked about the provider on the date below.
#
# [tiers] and [efforts] are the shipped layer of the settings section
# [providers.claude-code]. They are a proposal: `init` shows the mapping and
# the user confirms or changes it. Do not edit this file to change a mapping;
# put the key in a settings file, for example ~/.agents/workflow.toml:
#   [providers.claude-code.tiers]
#   deep = "fable"
# The rest of the file is not a setting. It is what setup knows about the
# provider, and `doctor` compares it with what is installed.
#
# Sources, read on the checked date:
#   https://code.claude.com/docs/en/sub-agents    (a definition's `model` and `effort`)
#   https://code.claude.com/docs/en/model-config  (aliases; effort levels per model)
#   https://code.claude.com/docs/en/memory        (the version that reads AGENTS.md)

schema_version = 1

checked_on_version = "2.1.289"
checked_on_date = "2026-10-05"
# Before this version some sessions (on Amazon Bedrock, or with telemetry
# disabled) read CLAUDE.md files only. From it on, the memory page lists
# these cases in which a repository's AGENTS.md is still not read:
#   - a CLAUDE.md, .claude/CLAUDE.md or CLAUDE.local.md is in the working
#     directory or above it; by default it is read instead;
#   - the built-in `agents-md` plugin is disabled;
#   - in some cases, the first session after an upgrade from 2.1.276 or earlier.
oldest_supported_version = "2.1.281"

[model_list]
# No `command`: Claude Code has no command that lists models without starting
# a session, so nothing here can be compared with a live list.
note = "Claude Code has no command that lists models without starting a session; the dictionary alone is used."

[tiers]
fast = "haiku"
standard = "sonnet"
deep = "opus"
frontier = "fable"

# Framework effort name -> the value written into a subagent definition.
# The names are the same on Claude Code. `xhigh`, between high and max, has no
# framework name; it is reached only by an explicit override in a settings file:
#   [providers.claude-code.efforts]
#   high = "xhigh"
[efforts]
low = "low"
medium = "medium"
high = "high"
max = "max"

# The models a definition can name by alias. A definition may also name a full
# model id, such as claude-opus-5-5; such a model is not listed here and
# nothing is known about its effort levels.
#
# The effort levels are those of the model each alias resolves to on the
# Anthropic API at the checked version: Sonnet 5.5, Opus 5.5, Fable 5.1. On
# another provider (Bedrock, Foundry, a gateway) an alias may resolve to an
# older model with fewer levels, or to one with none.

# The model configuration page lists no Haiku model among those with effort
# levels, and says "Models not listed here do not support effort".
[models.haiku]
efforts = []

[models.sonnet]
efforts = ["low", "medium", "high", "xhigh", "max"]

[models.opus]
efforts = ["low", "medium", "high", "xhigh", "max"]

[models.fable]
efforts = ["low", "medium", "high", "xhigh", "max"]
